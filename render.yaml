# Render Blueprint - deploy via Render dashboard: New > Blueprint, point at
# this repo. Provisions the backend web service and its Redis; Postgres is
# NOT provisioned here - the database is Neon (external to Render), so
# DATABASE_URL is a manually-set secret below instead of Render's
# `fromDatabase` wiring (which only works for a database Render itself
# provisions). Set the actual value in the Render dashboard after the
# blueprint is applied: Service > Environment > DATABASE_URL. Use Neon's
# "direct" (non `-pooler`) connection string - see the app's own pooling
# in TypeORM, no need for Neon's PgBouncer on top of it - and keep its
# `?sslmode=require` suffix; `pg` (via `pg-connection-string`) parses that
# into full certificate verification automatically, no extra ssl config
# needed in app.module.ts.
#
# NOT verified against a live Render deploy - I don't have access to
# Render from this environment. Field names here (`type: redis`, `plan:
# free`, `fromService` syntax) match Render's blueprint spec as of this
# writing; Render has renamed things before (their Redis offering is now
# branded "Key Value" in the dashboard, though the blueprint `type` may
# still be `redis` - check Render's current Blueprint docs before relying
# on this working unattended).
#
# This repo is an npm-workspaces monorepo (apps/backend depends on
# packages/shared-types, packages/game-engine, packages/config) - the
# build/start commands below deliberately run from the repo root, not
# apps/backend, so workspace symlinks resolve correctly. SKIP_GAME_BUILD
# skips the (slow, backend-irrelevant) Phaser bundle build - see root
# package.json's postinstall.

services:
  - type: redis
    name: battle-formation-redis
    plan: free
    ipAllowList: [] # internal-only; Render services in the same account reach it over the private network regardless

  - type: web
    name: battle-formation-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=@battle-formation/backend
    # migration:run before every start is idempotent (TypeORM tracks what's
    # already applied) - simple and correct, but on a paid plan Render's
    # "Pre-Deploy Command" is the more idiomatic place for this so a failed
    # migration blocks the deploy instead of crash-looping the service.
    startCommand: npm run migration:run --workspace=@battle-formation/backend && npm run start --workspace=@battle-formation/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_GAME_BUILD
        value: "true"
      - key: DATABASE_URL
        sync: false # secret, set manually in the dashboard - see the Neon note above
      - key: REDIS_URL
        fromService:
          type: redis
          name: battle-formation-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates and stores a random value
      - key: JWT_EXPIRES_IN
        value: 7d
